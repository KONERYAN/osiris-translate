<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px/1.6 system-ui, -apple-system, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #1f2933; }
    h1 { font-size: 18px; }
    .field { margin: 18px 0; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type=text], textarea { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
    textarea { height: 80px; resize: vertical; font-family: ui-monospace, monospace; font-size: 12px; }
    .hint { color: #6b7280; font-size: 12px; margin-top: 4px; }
    button { padding: 8px 16px; cursor: pointer; border: 1px solid #cbd5e1; background: #2563eb; color: #fff; border-radius: 6px; font: inherit; }
    button:hover { background: #1d4ed8; }
    #status { margin-left: 12px; color: #16a34a; font-size: 13px; }
    code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>OSIRIS Translate 设置</h1>

  <div class="field">
    <label><input type="checkbox" id="online"> 启用在线翻译兜底</label>
    <p class="hint">内置词典未覆盖的词条，会发往下面的接口翻译。关闭则完全离线。</p>
  </div>

  <div class="field">
    <label for="endpoint">翻译接口地址（LibreTranslate 兼容）</label>
    <input type="text" id="endpoint" placeholder="https://你的实例/translate">
    <p class="hint">需为 LibreTranslate 协议：<code>POST {q, source:"nl", target}</code>。留空则不走在线翻译。</p>
  </div>

  <div class="field">
    <label for="origins">自定义 OSIRIS 域名</label>
    <textarea id="origins" placeholder="https://osiris.example.com
https://portal.school.nl"></textarea>
    <p class="hint">每行一个。保存时会请求这些站点的运行权限，插件才会注入。已内置多数荷兰高校域名。</p>
  </div>

  <div class="field">
    <button id="save">保存</button>
    <span id="status"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
